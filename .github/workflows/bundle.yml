name: bundle
# Build the zero-install portable bundle. Runs on version tags (v*) and
# manually from the Actions tab; tag runs also publish a GitHub Release
# with the archive attached — the download the updater and users fetch.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos, arch: arm64 }
          - { os: macos-15-intel, platform: macos, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          # Linux arm64: the launcher already resolves this asset name, and
          # make-bundle.sh maps uname -m arm64 to the matching Node binary.
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          # Windows x64: make-bundle.ps1 stages with pnpm's hoisted linker
          # (real files, no junctions) and packs via tar.exe; the smoke step
          # boots the bundle and probes the port before anything ships.
          # Experimental until its pipeline settles: a red windows job must
          # never hold the release (or the notifications) hostage for the
          # four proven platforms.
          - { os: windows-2025, platform: windows, arch: x64, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    # Hang insurance: the first windows run burned a 6-hour runner in a
    # junction-recursion loop; no single job may ever do that again.
    timeout-minutes: 120
    defaults:
      run:
        # bash everywhere (git-bash on Windows) keeps the shared steps
        # identical across the matrix; the PowerShell steps opt out below.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm (corepack, from packageManager field)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Windows node_modules layout (Windows only)
        # pnpm 11 reads its settings from pnpm-workspace.yaml, NOT .npmrc —
        # earlier attempts appended node-linker/inject-workspace-packages to
        # .npmrc and pnpm silently ignored both (both runs left behind the
        # identical 5,771 junctions of the isolated layout). This key must
        # land BEFORE the first install, so the .pnpm junction universe is
        # never laid down: nodeLinker: hoisted -> flat real-file
        # node_modules for external deps (the default isolated layout links
        # through node_modules/.pnpm junctions, which cannot survive
        # zip -> extract on user machines). Workspace packages STAY
        # junctioned into the live source tree — deliberately: tests and
        # builds deep-import sibling package sources
        # (@deepseek-ai/x/src/index.ts), which only resolves through links
        # to the real tree; injected copies are packed without src/ and
        # break the build (seen on the inject attempt). The ~500 remaining
        # workspace junctions are materialized by make-bundle.ps1.
        if: runner.os == 'Windows'
        run: |
          printf '\nnodeLinker: hoisted\n' >> pnpm-workspace.yaml
          tail -2 pnpm-workspace.yaml

      - name: Install dependencies
        timeout-minutes: 30
        run: pnpm install --frozen-lockfile

      - name: Verify node_modules layout (Windows only)
        # Fail in minutes, not after a 45-minute assemble grind. The
        # discriminator: junctions DIRECTLY under node_modules. Isolated
        # links ~1,500+ external packages there through .pnpm; hoisted
        # leaves real dirs (hardlinks) with junctions only for workspace
        # packages (~100). (.pnpm exists under BOTH linkers — it is pnpm's
        # staging area, not an isolated-only marker; that assumption
        # misfired on attempt 25. Calibration: isolated ~5,771 total
        # junctions, hoisted-only ~2,546, hoisted+inject 492.)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rootJ = @(Get-ChildItem node_modules -Directory -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count
          $rootJ += @(Get-ChildItem node_modules -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.PSIsContainer -and $_.Name -like '*@*' } |
            ForEach-Object { Get-ChildItem $_.FullName -Directory -Force -ErrorAction SilentlyContinue } |
            Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count
          Write-Host "root-level node_modules junctions: $rootJ (isolated ~1500+, hoisted ~100)"
          if ($rootJ -gt 400) {
            Write-Host "::error::isolated linker active — nodeLinker: hoisted did not apply ($rootJ root junctions)"
            exit 1
          }

      - name: Build host, client, and web bundles
        run: |
          pnpm run build:lib:host
          pnpm run build:lib:client
          pnpm run build:web

      - name: Assemble portable bundle (macOS/Linux)
        timeout-minutes: 45
        if: runner.os != 'Windows'
        # Stamp the bundle from the tag itself, so asset names always match
        # the release the launcher searches for (v0.1.4 -> 0.1.4).
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/make-bundle.sh

      - name: Assemble portable bundle (Windows)
        # With the inject-first layout there are ~no junctions to dereference,
        # so the assembly should finish well inside 45 minutes. A hard budget
        # here fails fast instead of grinding for 100.
        timeout-minutes: 45
        if: runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        shell: pwsh
        run: scripts/make-bundle.ps1

      - name: Smoke test the Windows bundle
        # Boot the freshly packed bundle and probe the port — a bundle that
        # cannot start must not ship.
        timeout-minutes: 20
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-windows.ps1

      - name: Upload workflow artifact
        # Convenience copy only — the release below is the real distribution.
        # Must never fail the job: GitHub artifact storage quota exhaustion
        # otherwise blocks every release (seen on v0.1.5's first run).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: baby-whale-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 14

      - name: Publish npm package (tag runs only)
        # Activates once an NPM_TOKEN secret (granular token, bypass-2FA,
        # read/write on @haifai) exists — until then this step no-ops green.
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc
          npm publish ./npm/bwhale --access public

      - name: Publish release (tag runs only)
        # Concurrency-safe: the four matrix jobs race here, so the first
        # creates the release and the rest append their assets to it.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=()
          # Every zip ships with its .sha256 sidecar (written by
          # make-bundle.sh/ps1): the launcher refuses a bundle whose sidecar
          # is missing, so an asset without one must never publish alone.
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            files+=("$f")
            [ -e "$f.sha256" ] || { echo "missing checksum sidecar for $f" >&2; exit 1; }
            files+=("$f.sha256")
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber \
            || gh release create "$GITHUB_REF_NAME" "${files[@]}" \
                 --title "$GITHUB_REF_NAME" --generate-notes --latest
