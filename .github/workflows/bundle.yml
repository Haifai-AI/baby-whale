name: bundle
# Build the zero-install portable bundle. Runs on version tags (v*) and
# manually from the Actions tab; tag runs also publish a GitHub Release
# with the archive attached — the download the updater and users fetch.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos, arch: arm64 }
          - { os: macos-15-intel, platform: macos, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          # Linux arm64: the launcher already resolves this asset name, and
          # make-bundle.sh maps uname -m arm64 to the matching Node binary.
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          # Windows x64: make-bundle.ps1 stages with pnpm's hoisted linker
          # (real files, no junctions) and packs via tar.exe; the smoke step
          # boots the bundle and probes the port before anything ships.
          # Experimental until its pipeline settles: a red windows job must
          # never hold the release (or the notifications) hostage for the
          # four proven platforms.
          - { os: windows-2025, platform: windows, arch: x64, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    # Hang insurance: the first windows run burned a 6-hour runner in a
    # junction-recursion loop; no single job may ever do that again.
    timeout-minutes: 120
    defaults:
      run:
        # bash everywhere (git-bash on Windows) keeps the shared steps
        # identical across the matrix; the PowerShell steps opt out below.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Activate pnpm (corepack, from packageManager field)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Windows node_modules layout (Windows only)
        # pnpm 11 reads its settings from pnpm-workspace.yaml, NOT .npmrc —
        # attempts 20/21 appended node-linker/inject-workspace-packages to
        # .npmrc and pnpm silently ignored both (both runs left behind the
        # identical 5,771 junctions of the isolated layout). These keys must
        # land BEFORE the first install, so junctions are never laid down:
        # - nodeLinker: hoisted -> flat real-file node_modules (the default
        #   isolated layout links through node_modules/.pnpm junctions,
        #   which cannot survive zip -> extract on user machines).
        # - injectWorkspacePackages: workspace deps materialize as real
        #   copies instead of junctions into the workspace tree.
        if: runner.os == 'Windows'
        run: |
          printf '\nnodeLinker: hoisted\ninjectWorkspacePackages: true\n' >> pnpm-workspace.yaml
          tail -3 pnpm-workspace.yaml

      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 30
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Windows)
        # injectWorkspacePackages is recorded INSIDE the lockfile (settings
        # block), so turning it on makes --frozen-lockfile refuse to run
        # (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH). The lockfile update is
        # CI-local — never committed — and resolution is unchanged: same
        # specs, same pinned versions.
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: pnpm install --no-frozen-lockfile

      - name: Verify node_modules layout (Windows only)
        # Fail in minutes, not after a 45-minute assemble grind: if the
        # pnpm-workspace.yaml settings above were ignored, the isolated
        # linker leaves ~5,800 junctions behind. Hoisted + injected should
        # leave near zero; a few hundred workspace links are tolerable and
        # the assemble pass dereferences whatever remains.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nm = Get-ChildItem -Path . -Recurse -Depth 3 -Directory -Filter node_modules -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\(\.git|dist)(\\|$)' }
          $j = @($nm | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -Directory -Force -Attributes ReparsePoint -ErrorAction SilentlyContinue
          }).Count
          Write-Host "junction count after install: $j"
          if ($j -gt 1500) {
            Write-Host "::error::pnpm layout settings did not apply — isolated linker still active ($j junctions)"
            exit 1
          }

      - name: Build host, client, and web bundles
        run: |
          pnpm run build:lib:host
          pnpm run build:lib:client
          pnpm run build:web

      - name: Assemble portable bundle (macOS/Linux)
        timeout-minutes: 45
        if: runner.os != 'Windows'
        # Stamp the bundle from the tag itself, so asset names always match
        # the release the launcher searches for (v0.1.4 -> 0.1.4).
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/make-bundle.sh

      - name: Refresh injected workspace copies (Windows only)
        # The build wrote lib/dist into the workspace source dirs AFTER the
        # install snapshot, so the injected node_modules copies are stale.
        # --force makes pnpm rebuild node_modules from the hot store, picking
        # up the fresh build output. A plain re-install does NOT work here:
        # pnpm sees "Already up to date" and never revisits existing copies.
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: pnpm install --no-frozen-lockfile --force

      - name: Assemble portable bundle (Windows)
        # With the inject-first layout there are ~no junctions to dereference,
        # so the assembly should finish well inside 45 minutes. A hard budget
        # here fails fast instead of grinding for 100.
        timeout-minutes: 45
        if: runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        shell: pwsh
        run: scripts/make-bundle.ps1

      - name: Smoke test the Windows bundle
        # Boot the freshly packed bundle and probe the port — a bundle that
        # cannot start must not ship.
        timeout-minutes: 20
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-windows.ps1

      - name: Upload workflow artifact
        # Convenience copy only — the release below is the real distribution.
        # Must never fail the job: GitHub artifact storage quota exhaustion
        # otherwise blocks every release (seen on v0.1.5's first run).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: baby-whale-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 14

      - name: Publish npm package (tag runs only)
        # Activates once an NPM_TOKEN secret (granular token, bypass-2FA,
        # read/write on @haifai) exists — until then this step no-ops green.
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc
          npm publish ./npm/bwhale --access public

      - name: Publish release (tag runs only)
        # Concurrency-safe: the four matrix jobs race here, so the first
        # creates the release and the rest append their assets to it.
        # Glob-safe: zsh errors on unmatched dist/*.dmg (linux has none).
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=()
          for f in dist/*.zip dist/*.dmg; do [ -e "$f" ] && files+=("$f"); done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber \
            || gh release create "$GITHUB_REF_NAME" "${files[@]}" \
                 --title "$GITHUB_REF_NAME" --generate-notes --latest
